name: Build and Release Update Service

on:
  push:
    tags:
      - 'update_v*-[0-9]*'

jobs:
  build-rpi32:
    runs-on: ubuntu-latest
    container:
      image: xnor/rnbo-runner-xpile:0.2
      options: --user root
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build rpi32
        run: |
          chown -R build:build "$GITHUB_WORKSPACE"
          su - build -s /bin/bash -c "
            RUNNER_SRC='$GITHUB_WORKSPACE' RUNNER_ARCH=armhf \\
              '$GITHUB_WORKSPACE/docker/build-update.sh'
          "
      - name: Store deb
        uses: actions/upload-artifact@v4
        with:
          name: rpi32-update-deb
          path: build-rpi-armhf-update/*.deb

  build-rpi64:
    runs-on: ubuntu-latest
    container:
      image: xnor/rnbo-runner-xpile:0.2
      options: --user root
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build rpi64
        run: |
          chown -R build:build "$GITHUB_WORKSPACE"
          su - build -s /bin/bash -c "
            RUNNER_SRC='$GITHUB_WORKSPACE' RUNNER_ARCH=arm64 \\
              '$GITHUB_WORKSPACE/docker/build-update.sh'
          "
      - name: Store deb
        uses: actions/upload-artifact@v4
        with:
          name: rpi64-update-deb
          path: build-rpi-arm64-update/*.deb

  release:
    runs-on: ubuntu-latest
    needs: [build-rpi32, build-rpi64]
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: 'rpi*-update-deb'
          merge-multiple: true
          path: debs
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: debs/*.deb
