name: Build and Release

on:
  push:
    tags:
      # v1.4.6-11 and v1.4.6-11-beta.1, see scripts/runner-version.mjs
      - 'v*-[0-9]*'

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      rnbo_version: ${{ steps.parse.outputs.rnbo_version }}
      prerelease: ${{ steps.parse.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          # all tags have to be visible to the version check
          fetch-depth: 0
      - name: Parse tag
        id: parse
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$TAG" =~ ^v(.+)-([0-9]+)(-(beta\.[0-9]+))?$ ]]; then
            echo "tag '$TAG' is not of the form v<rnbo version>-<app version>[-beta.<n>]" >&2
            exit 1
          fi
          echo "rnbo_version=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
          echo "prerelease=${BASH_REMATCH[4]}" >> "$GITHUB_OUTPUT"
      - name: Check version
        env:
          TAG: ${{ github.ref_name }}
        run: node scripts/runner-version.mjs check --tag "$TAG"
      - name: Release notes
        env:
          TAG: ${{ github.ref_name }}
        run: node scripts/runner-version.mjs notes --tag "$TAG" > release-notes.md
      - name: Store release notes
        uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: release-notes.md

  build-rpi32:
    runs-on: ubuntu-latest
    needs: check
    container:
      image: xnor/rnbo-runner-xpile:0.2
      options: --user root
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build rpi32
        env:
          RNBO_VERSION: ${{ needs.check.outputs.rnbo_version }}
          PRERELEASE: ${{ needs.check.outputs.prerelease }}
        run: |
          chown -R build:build "$GITHUB_WORKSPACE"
          su - build -s /bin/bash -c "
            RUNNER_SRC='$GITHUB_WORKSPACE' RUNNER_ARCH=armhf \\
              RNBO_CONAN_VERSION='$RNBO_VERSION' RNBO_CONAN_TAG=c74/stable RUNNER_PRERELEASE='$PRERELEASE' \\
              '$GITHUB_WORKSPACE/docker/build-runner.sh'
          "
      - name: Store deb
        uses: actions/upload-artifact@v4
        with:
          name: rpi32-deb
          path: build-rpi-armhf/*.deb

  build-rpi64:
    runs-on: ubuntu-latest
    needs: check
    container:
      image: xnor/rnbo-runner-xpile:0.2
      options: --user root
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build rpi64
        env:
          RNBO_VERSION: ${{ needs.check.outputs.rnbo_version }}
          PRERELEASE: ${{ needs.check.outputs.prerelease }}
        run: |
          chown -R build:build "$GITHUB_WORKSPACE"
          su - build -s /bin/bash -c "
            RUNNER_SRC='$GITHUB_WORKSPACE' RUNNER_ARCH=arm64 \\
              RNBO_CONAN_VERSION='$RNBO_VERSION' RNBO_CONAN_TAG=c74/stable RUNNER_PRERELEASE='$PRERELEASE' \\
              '$GITHUB_WORKSPACE/docker/build-runner.sh'
          "
      - name: Store deb
        uses: actions/upload-artifact@v4
        with:
          name: rpi64-deb
          path: build-rpi-arm64/*.deb

  build-move:
    runs-on: ubuntu-latest
    needs: check
    container:
      image: xnor/rnbo-runner-xpile:0.2
      options: --user root
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build move
        env:
          RNBO_VERSION: ${{ needs.check.outputs.rnbo_version }}
          PRERELEASE: ${{ needs.check.outputs.prerelease }}
        run: |
          chown -R build:build "$GITHUB_WORKSPACE"
          su - build -s /bin/bash -c "
            RUNNER_SRC='$GITHUB_WORKSPACE' RUNNER_ARCH=move \\
              RNBO_CONAN_VERSION='$RNBO_VERSION' RNBO_CONAN_TAG=c74/stable RUNNER_PRERELEASE='$PRERELEASE' \\
              '$GITHUB_WORKSPACE/docker/build-runner.sh'
          "
      - name: Store tarball
        uses: actions/upload-artifact@v4
        with:
          name: move-tar
          path: build-move/*.tar.gz

  release:
    runs-on: ubuntu-latest
    needs: [check, build-rpi32, build-rpi64, build-move]
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: 'rpi*-deb'
          merge-multiple: true
          path: debs
      - name: Download move tarball
        uses: actions/download-artifact@v4
        with:
          name: move-tar
          path: move
      - name: Download release notes
        uses: actions/download-artifact@v4
        with:
          name: release-notes
          path: notes
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            debs/*.deb
            move/*.tar.gz
          body_path: notes/release-notes.md
          prerelease: ${{ needs.check.outputs.prerelease != '' }}
