name: Build and Release

on:
  push:
    tags:
      - 'v*-[0-9]*'

jobs:
  build-rpi32:
    runs-on: ubuntu-latest
    container:
      image: xnor/rnbo-runner-xpile:0.2
      options: --user root
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Parse tag
        id: parse
        run: |
          TAG="${{ github.ref_name }}"
          RNBO_VERSION=$(echo "$TAG" | sed 's/^v//' | sed 's/-[0-9]*$//')
          echo "rnbo_version=$RNBO_VERSION" >> $GITHUB_OUTPUT
      - name: Build rpi32
        run: |
          chown -R build:build "$GITHUB_WORKSPACE"
          su - build -s /bin/bash -c "
            RUNNER_SRC='$GITHUB_WORKSPACE' RUNNER_ARCH=armhf \\
              RNBO_CONAN_VERSION='${{ steps.parse.outputs.rnbo_version }}' RNBO_CONAN_TAG=c74/stable \\
              '$GITHUB_WORKSPACE/docker/build-runner.sh'
          "
      - name: Store deb
        uses: actions/upload-artifact@v4
        with:
          name: rpi32-deb
          path: build-rpi-armhf/*.deb

  build-rpi64:
    runs-on: ubuntu-latest
    container:
      image: xnor/rnbo-runner-xpile:0.2
      options: --user root
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Parse tag
        id: parse
        run: |
          TAG="${{ github.ref_name }}"
          RNBO_VERSION=$(echo "$TAG" | sed 's/^v//' | sed 's/-[0-9]*$//')
          echo "rnbo_version=$RNBO_VERSION" >> $GITHUB_OUTPUT
      - name: Build rpi64
        run: |
          chown -R build:build "$GITHUB_WORKSPACE"
          su - build -s /bin/bash -c "
            RUNNER_SRC='$GITHUB_WORKSPACE' RUNNER_ARCH=arm64 \\
              RNBO_CONAN_VERSION='${{ steps.parse.outputs.rnbo_version }}' RNBO_CONAN_TAG=c74/stable \\
              '$GITHUB_WORKSPACE/docker/build-runner.sh'
          "
      - name: Store deb
        uses: actions/upload-artifact@v4
        with:
          name: rpi64-deb
          path: build-rpi-arm64/*.deb

  release:
    runs-on: ubuntu-latest
    needs: [build-rpi32, build-rpi64]
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: 'rpi*-deb'
          merge-multiple: true
          path: debs
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: debs/*.deb
